<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Belajar HTML - NIOMIC</title>
</head>

<body>

    <!-- Website Detik -->
    <iframe
        src="https://www.hostinger.com"
        width="500"
        height="500">
    </iframe>

    <!-- PDF -->
    <iframe
        src="dummy.pdf"
        width="500"
        height="500">
    </iframe>
 
    <br><br>

    <!-- YouTube -->
    <iframe
        width="500"
        height="375"
        src="https://www.youtube.com/embed/Z1BCujX3pw8"
        title="YouTube video"
        frameborder="0"
        allowfullscreen>
    </iframe>

    <!-- Google Maps -->
    <iframe
        src="https://www.google.com/maps?q=National+Monument+Jakarta&output=embed"
        width="500"
        height="375"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>

</body>
</html>
